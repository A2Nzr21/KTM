appId: org.ktt.ktm
productName: KTM
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
compression: maximum
electronVersion: 43.7.0
directories:
    buildResources: assets
files:
    - 'out/**/*'
    - 'package.json'
    - '!out/**/*.map'
    - '!**/node_modules/react-icons/**'
    - '!**/node_modules/butterchurn/**'
    - '!**/node_modules/butterchurn-presets/**'
    - '!**/node_modules/@mantine/core/**'
    - '!**/node_modules/@mantine/dates/**'
    - '!**/node_modules/@mantine/form/**'
    - '!**/node_modules/@mantine/hooks/**'
    - '!**/node_modules/react-dom/**'
    - '!**/node_modules/react-router/**'
    - '!**/node_modules/react-player/**'
    - '!**/node_modules/react-i18next/**'
    - '!**/node_modules/react-window/**'
    - '!**/node_modules/@tanstack/react-query/**'
    - '!**/node_modules/overlayscrollbars/**'
    - '!**/node_modules/dompurify/**'
    - '!**/node_modules/wavesurfer.js/**'
    - '!**/node_modules/fast-xml-parser/**'
    - '!**/node_modules/dayjs/**'
    - '!**/node_modules/immer/**'
    - '!**/node_modules/motion/**'
    - '!**/node_modules/framer-motion/**'
    - '!**/node_modules/@atlaskit/pragmatic-drag-and-drop/**'
    - '!**/node_modules/@atlaskit/pragmatic-drag-and-drop-auto-scroll/**'
    - '!**/node_modules/@atlaskit/pragmatic-drag-and-drop-hitbox/**'
    - '!**/node_modules/icecast-metadata-stats/**'
    - '!**/node_modules/qs/**'
extraResources:
    - assets/**
asarUnpack:
    - resources/**
win:
    target:
        - target: zip
          arch:
              - x64
              - arm64
        - target: nsis
          arch:
              - x64
              - arm64
    icon: assets/icons/icon.ico

nsis:
    allowToChangeInstallationDirectory: true
    oneClick: false
    shortcutName: ${productName}
    uninstallDisplayName: ${productName}
    createDesktopShortcut: always

mac:
    target:
        - target: dmg
          arch:
              - arm64
              - x64
        - target: zip
          arch:
              - arm64
              - x64
    icon: media/feishin.icon
    type: distribution
    hardenedRuntime: false
    identity: "-"
    entitlements: build/entitlements.mac.plist
    entitlementsInherit: build/entitlements.mac.plist
    gatekeeperAssess: false
    notarize: false
    extendInfo:
        NSAudioCaptureUsageDescription: 'System audio access is required for mpv visualizer capture in KTM'
        NSLocalNetworkUsageDescription: 'Local network is necessary for accessing servers hosted on the same system as KTM'

dmg:
    contents: [{ x: 130, y: 220 }, { x: 410, y: 220, type: link, path: /Applications }]

linux:
    target:
        - AppImage
        - deb
        - tar.xz
    category: AudioVideo;Audio;Player
    icon: assets/icons/icon.png
    artifactName: ${productName}-${os}-${arch}.${ext}

toolsets:
    appimage: '1.0.3'

npmRebuild: false
afterPack: scripts/trim-locales.mjs
afterAllArtifactBuild: scripts/after-all-artifact-build.mjs
publish:
    provider: github
    owner: A2Nzr21
    repo: KTM
    channel: latest
    releaseType: release